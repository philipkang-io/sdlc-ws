name: Lint, Test and Report

# Runs on every push, so a participant's branch push triggers the gate
# before a pull request exists.
on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  lint:
    name: Spec Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Postman CLI
        run: curl -o- "https://dl-cli.pstmn.io/install/linux64.sh" | sh

      - name: Login to Postman CLI
        run: postman login --with-api-key ${{ secrets.POSTMAN_API_KEY }}

      # Lints the spec file in this repo. The cloudResources.specs mapping in
      # .postman/resources.yaml resolves this path to the cloud spec UUID,
      # which is what allows --report-events to report into the API Catalog.
      - name: Lint API spec
        run: |
          postman spec lint "postman/specs/PostFinanceCo API.yaml" \
            --workspace-id "${{ vars.POSTMAN_WORKSPACE_ID }}" \
            --report-events

  test:
    name: API Smoke Tests
    needs: [lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2

      - name: Install dependencies
        run: uv sync --locked

      # CI tests the real implementation, not the mock: the API is started
      # inside the runner and the collection runs against localhost.
      - name: Start API server
        run: |
          nohup uv run fastapi run main.py --port 8000 > server.log 2>&1 &
          disown

      - name: Wait for API server to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "Server is up"
              exit 0
            fi
            sleep 1
          done
          echo "Server did not become ready within 30s" >&2
          echo "----- server.log -----"
          cat server.log
          exit 1

      - name: Install Postman CLI
        run: curl -o- "https://dl-cli.pstmn.io/install/linux64.sh" | sh

      - name: Login to Postman CLI
        run: postman login --with-api-key ${{ secrets.POSTMAN_API_KEY }}

      - name: Run API tests
        run: |
          postman collection run "postman/collections/PostFinanceCo API" \
            -e "postman/environments/Local Dev.environment.yaml" \
            --reporter-cli-no-success-assertions \
            --report-events
