$kind: http-request
description: |
  Creates a new transaction. There are two types of transactions:
  - **Deposit**: Add money to an account by setting transactionType to "DEPOSIT"
  - **Withdrawal**: Remove money from an account by setting transactionType to "WITHDRAWAL"

  **Important**: Transactions cannot be edited or deleted once created.
url: "{{baseUrl}}/api/v1/transactions"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
  Idempotency-Key: "{{$guid}}"
  x-mock-response-code: "201"
body:
  type: json
  content: |-
    {
      "accountId": "{{accountId}}",
      "amount": 10000,
      "currency": "POST_GOLD",
      "transactionType": "DEPOSIT"
    }
  $type: |-
    {
      "type": "object",
      "properties": {
        "accountId": {
          "type": "string",
          "example": "12345678",
          "description": "Source account ID (use \"0\" for deposits from external source)"
        },
        "amount": {
          "type": "number",
          "minimum": 0,
          "example": 10000,
          "description": "Transaction amount (must be positive)",
          "format": "double"
        },
        "currency": {
          "type": "string",
          "enum": [
            "POST_COINS",
            "POST_GOLD",
            "POST_BUCKS"
          ],
          "example": "POST_COINS",
          "description": "Currency type (must match account currencies)"
        },
        "transactionType": {
          "type": "string",
          "enum": [
            "WITHDRAWAL",
            "DEPOSIT"
          ],
          "example": "DEPOSIT",
          "description": "Type of transaction (deposit / withdrawal)"
        }
      },
      "required": [
        "accountId",
        "amount",
        "currency",
        "transactionType"
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      // Contract tests: Create new transaction (POST /api/v1/transactions)
      pm.test("Status code is 201", function () {
          pm.response.to.have.status(201);
      });

      pm.test("Content-Type is application/json", function () {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });

      const schema = {
          type: "object",
          required: ["transaction"],
          properties: {
              transaction: {
                  type: "object",
                  required: ["transactionId"],
                  properties: {
                      transactionId: { type: "string" }
                  }
              }
          }
      };

      pm.test("Response body matches create-transaction schema", function () {
          pm.response.to.have.jsonSchema(schema);
      });

      pm.test("Response time is under 2000ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(2000);
      });


      pm.test("Request includes Idempotency-Key header", function () {
          const headerValue = pm.request.headers.get("Idempotency-Key");
          pm.expect(headerValue, "Idempotency-Key header must be present on the request").to.exist;
          pm.expect(String(headerValue).trim(), "Idempotency-Key header must not be empty").to.not.equal("");
      });

      pm.test("Idempotency-Key header has a practical format", function () {
          const headerValue = String(pm.request.headers.get("Idempotency-Key") || "").trim();
          pm.expect(headerValue.length, "Idempotency-Key should be at least 8 characters long").to.be.at.least(8);
          pm.expect(headerValue, "Idempotency-Key should contain visible non-whitespace characters").to.match(/^\S+$/);
      });

      pm.test("Idempotent-Replayed response header is boolean-compatible when present", function () {
          const replayed = pm.response.headers.get("Idempotent-Replayed");
          if (replayed !== undefined && replayed !== null) {
              pm.expect(String(replayed).trim().toLowerCase()).to.be.oneOf(["true", "false", "1", "0"]);
          }
      });

      pm.test("Response body contains a non-empty transaction.transactionId string", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.nested.property("transaction.transactionId");
          pm.expect(json.transaction.transactionId).to.be.a("string").and.to.not.equal("");
      });

      // Capture transactionId for downstream chaining
      if (pm.response.code >= 200 && pm.response.code < 300) {
          const response = pm.response.json();
          pm.collectionVariables.set("transactionId", response.transaction.transactionId);
      }
    language: text/javascript
examples: ./.resources/Create new transaction.resources/examples
order: 2000
